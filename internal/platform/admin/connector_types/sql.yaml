type: sql
subtypes:
  - subtype: postgres
    name: "PostgreSQL"
    description: "Connect to PostgreSQL database"
    connection_template: "postgresql://$USERNAME:$PASSWORD@$HOSTNAME:$PORT/$DATABASE"
    warning: "All agents using this connector will have the same database access. Agent Mesh cannot restrict what queries agents execute—access control must be configured at the database level. For security, use credentials with minimal necessary permissions (e.g., read-only, limited to specific schemas)."
    usage_guidance: |
      Use the PostgreSQL connector when the user wants to query or interact with
      a PostgreSQL database. The connector provides a SQL tool that the agent can
      use to run read and write queries. The user needs to provide the host, port,
      database name, username, and password. For the builder, use
      <<__SAM_REQUIRED__>> for password and any other values not mentioned in the
      conversation.
    field_schema:
      - name: database
        type: string
        label: "Database Name"
        required: true
        order: 1
        hint: "Name of the PostgreSQL database to connect to"
        validation:
          min_length: 1
          max_length: 255
          pattern: "^[a-zA-Z0-9_$]+$"
      - name: hostname
        type: string
        label: "Database Host"
        required: true
        order: 2
        hint: "Database hostname or IP address"
        validation:
          min_length: 1
          max_length: 255
          pattern: "^((([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])|(([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\\-]*[a-zA-Z0-9])\\.)*([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\\-]*[a-zA-Z0-9]))$"
      - name: port
        type: number
        label: "Port"
        required: false
        order: 3
        default: 5432
        placeholder: "5432"
        hint: "If no value is provided, the default port number (5432) will be used."
        validation:
          min: 1
          max: 65535
      - name: username
        type: string
        label: "Username"
        required: true
        order: 4
        validation:
          min_length: 1
          max_length: 255
      - name: password
        type: password
        label: "Password"
        required: true
        secret: true
        order: 5
        hint: "Leave placeholder to keep existing value. After saving, this value will no longer be displayed."
      - name: hil
        type: hil
        label: "Tool Approvals"
        required: false
        hidden: true
        order: 900
        description: "Human approval before this connector's tools run. Keys under tools: are role names: `sql_query`."
        hint: "Approval gates for this connector's tools, keyed by role (`sql_query`). `{}` removes them."

