type: document_db
subtypes:
  - subtype: mongodb
    name: "MongoDB"
    description: "Connect to a MongoDB database"
    warning: "All agents using this connector will have the same database access. Agent Mesh cannot restrict what queries agents execute—access control must be configured at the database level. For security, use credentials with minimal necessary permissions (e.g., read-only, scoped to a single database/collection)."
    usage_guidance: |
      Use the MongoDB connector when the user wants to query or interact with
      a MongoDB database via aggregation pipelines. The connector exposes one
      collection per connector—create separate connectors for additional
      collections. The user provides the host, optional credentials, a database
      name, and a collection name. Choose the mongodb+srv scheme for DNS
      seedlist clusters (e.g. MongoDB Atlas), which ignores the port. For the
      builder, use <<__SAM_REQUIRED__>> for the password.
    field_schema:
      - name: scheme
        type: select
        label: "Scheme"
        required: false
        order: 1
        default: "mongodb"
        hint: "Connection protocol scheme."
        options:
          - label: "Standard (mongodb)"
            value: "mongodb"
            description: "Direct connection to a host and port"
          - label: "DNS Seedlist (mongodb+srv)"
            value: "mongodb+srv"
            description: "Resolve hosts via SRV records (e.g. MongoDB Atlas); ignores the port field"
      - name: hostname
        type: string
        label: "Host"
        required: true
        order: 2
        placeholder: "cluster0.abcd.mongodb.net"
        hint: "MongoDB host or cluster address (without scheme or port)."
        validation:
          min_length: 1
          max_length: 255
          pattern: "^((([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])|(([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\\-]*[a-zA-Z0-9])\\.)*([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\\-]*[a-zA-Z0-9]))$"
          error_msg: "Host must be a valid hostname or IPv4 address"
      - name: port
        type: number
        label: "Port"
        required: false
        order: 3
        default: 27017
        placeholder: "27017"
        hint: "Ignored for the mongodb+srv scheme. Defaults to 27017."
        validation:
          min: 1
          max: 65535
      - name: username
        type: string
        label: "Username"
        required: false
        order: 4
        hint: "Optional. Leave blank for unauthenticated access."
        validation:
          max_length: 255
      - name: password
        type: password
        label: "Password"
        required: false
        secret: true
        order: 5
        hint: "Leave the placeholder to keep the existing value. After saving, this value is no longer displayed."
      - name: database
        type: string
        label: "Database Name"
        required: false
        order: 6
        hint: "Authentication database and default database. Often required when a username is set (e.g. admin)."
        validation:
          max_length: 255
          pattern: "^[a-zA-Z0-9_.\\-]*$"
      - name: collection
        type: string
        label: "Collection"
        required: true
        order: 7
        hint: "MongoDB collection this connector will query."
        validation:
          min_length: 1
          max_length: 255
          pattern: "^[a-zA-Z0-9_.\\-]+$"
      - name: options
        type: string
        label: "Connection Options"
        required: false
        order: 8
        placeholder: "retryWrites=true&w=majority"
        hint: "Optional URI query options, without the leading '?'. Examples: retryWrites=true, authSource=admin, tls=true."
        validation:
          max_length: 2048
          pattern: "^[^?#\\s]*$"
      - name: hil
        type: hil
        label: "Tool Approvals"
        required: false
        hidden: true
        order: 900
        description: "Human approval before this connector's tools run. Keys under tools: are role names: `mongo_query`."
        hint: "Approval gates for this connector's tools, keyed by role (`mongo_query`). `{}` removes them."

  - subtype: dynamodb
    name: "DynamoDB"
    description: "Connect to an Amazon DynamoDB table"
    warning: "Agents using this connector run queries with the configured AWS credentials. Use a least-privilege IAM role or user scoped to specific tables. Agent Mesh cannot restrict what queries agents execute—access control must be configured at the AWS IAM level."
    usage_guidance: |
      Use the DynamoDB connector when the user wants an agent to query an
      Amazon DynamoDB table. Each connector targets a single table.
      Authentication supports either AWS Access Keys or IAM Role Chaining
      (only available when Agent Mesh is deployed on AWS). For Role Chaining,
      provide the role ARN to assume.

      Always use <<__SAM_REQUIRED__>> for the access key, secret key, and
      external ID fields since these are AWS credentials that should never
      appear in artifacts.
    field_schema:
      - name: region
        type: string
        label: "AWS Region"
        required: true
        order: 1
        default: "us-east-1"
        placeholder: "us-east-1"
        hint: "AWS region where the DynamoDB table lives."
        validation:
          min_length: 1
          max_length: 50
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          error_msg: "AWS Region must be a valid region name (e.g., us-east-1, eu-west-1)"
      - name: table_name
        type: string
        label: "Table Name"
        required: true
        order: 2
        hint: "DynamoDB table this connector will query."
        validation:
          min_length: 3
          max_length: 255
          pattern: "^[a-zA-Z0-9_.\\-]+$"
      - name: auth_type
        type: select
        label: "Authentication Scheme"
        required: true
        order: 3
        default: "access_key"
        hint: "How the connector authenticates with AWS."
        options:
          - label: "AWS Access Key"
            value: "access_key"
            description: "Authenticate with a static access key ID and secret key pair"
          - label: "AWS IAM Role Chaining"
            value: "iam"
            description: "Assume an IAM role via the node's instance credentials (requires SAM running on AWS)"
      - name: aws_access_key_id
        type: password
        label: "AWS Access Key ID"
        required: true
        secret: true
        order: 4
        visible_when:
          auth_type: "access_key"
        validation:
          min_length: 16
          max_length: 128
      - name: aws_secret_access_key
        type: password
        label: "AWS Secret Access Key"
        required: true
        secret: true
        order: 5
        visible_when:
          auth_type: "access_key"
        validation:
          min_length: 30
          max_length: 255
      - name: role_arn
        type: string
        label: "Role ARN"
        required: true
        order: 6
        placeholder: "arn:aws:iam::123456789012:role/SolaceDynamoDBAccess"
        hint: "ARN of the IAM role with permissions to query the DynamoDB table."
        visible_when:
          auth_type: "iam"
        validation:
          min_length: 20
          max_length: 2048
          pattern: "^arn:aws[a-zA-Z\\-]*:iam::\\d+:role/.+$"
          error_msg: "Role ARN must look like arn:aws:iam::<account>:role/<name>"
      - name: session_name
        type: string
        label: "Session Name"
        required: false
        order: 7
        placeholder: "solace-dynamodb-session"
        hint: "Session name for auditing the assumed role in AWS CloudTrail logs. Defaults to 'solace-document-db-session'."
        visible_when:
          auth_type: "iam"
        validation:
          min_length: 2
          max_length: 64
      - name: external_id
        type: password
        label: "External ID"
        required: false
        secret: true
        order: 8
        placeholder: "solace-sam-abc-123"
        hint: "Optional security token for cross-account access. Required if configured in the IAM role's trust policy."
        visible_when:
          auth_type: "iam"
        validation:
          min_length: 2
          max_length: 1224
      - name: hil
        type: hil
        label: "Tool Approvals"
        required: false
        hidden: true
        order: 900
        description: "Human approval before this connector's tools run. Keys under tools: are role names: `dynamodb_query`."
        hint: "Approval gates for this connector's tools, keyed by role (`dynamodb_query`). `{}` removes them."
