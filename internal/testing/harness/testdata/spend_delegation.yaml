test_case_id: "spend_delegation_001"
description: "TestAgent delegates to TestPeerAgentB, whose answer is cut off by max_tokens and auto-continued."
tags: ["spend"]
skip_intermediate_events: true

gateway_input:
  target_agent_name: "TestAgent"
  user_identity: "spend_user@example.com"
  trigger: "eval"
  channel: "slack"
  prompt:
    parts:
      - text: "Ask TestPeerAgentB to greet."

llm_interactions:
  - static_response:
      choices:
        - message:
            role: "assistant"
            content: "Asking B."
            tool_calls:
              - id: "call_peer_b"
                type: "function"
                function:
                  name: "peer_TestPeerAgentB"
                  arguments: '{"task_description": "Greet"}'
      usage: {prompt_tokens: 1000, completion_tokens: 50, total_tokens: 1050, cached_tokens: 600, cache_write_tokens: 200}

  - static_response:
      choices:
        - finish_reason: "length"
          message:
            role: "assistant"
            content: "Hello"
      usage: {prompt_tokens: 500, completion_tokens: 20, total_tokens: 520, cached_tokens: 100, cache_write_tokens: 40}

  - static_response:
      choices:
        - message:
            role: "assistant"
            content: " from B"
      usage: {prompt_tokens: 520, completion_tokens: 10, total_tokens: 530, cached_tokens: 300, cache_write_tokens: 0}

  - static_response:
      choices:
        - message:
            role: "assistant"
            content: "B said hello."
      usage: {prompt_tokens: 1200, completion_tokens: 30, total_tokens: 1230, cached_tokens: 900, cache_write_tokens: 100}

expected_gateway_output:
  - type: "final_response"
    kind: task
    id: '*'
    contextId: session_spend_delegation_001
    status:
      state: "completed"
      message:
        kind: message
        messageId: '*'
        role: agent
        parts:
          - type: "text"
            text_contains:
              - "B said hello."

expected_artifacts: []
