[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "sam-tool-python-executor"
version = "0.1.0"
description = "Python code executor tool for Solace Agent Mesh STR"
requires-python = ">=3.11.5"
dependencies = [
    "sam-tool-sdk",
    # Pre-baked into the STR image venv so LLM-generated code can use them. The
    # sandbox has NO network access, so nothing can be pip-installed at runtime
    # — this list IS the guaranteed runtime. Keep it offline-friendly (no libs
    # that download models/corpora on first use) and avoid duplicating what
    # dedicated STR tools already cover (pptx, pdf extraction, plotly, audio).
    #
    # Exact pins, so every STR image and desktop build ships the same versions.
    # uv.lock pins the transitive dependencies and their hashes; Dependabot
    # moves both.
    #
    # Data-science core.
    "numpy==2.4.6",
    "pandas==2.3.3",
    "scipy==1.17.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "Pillow==13.0.0",
    "python-dateutil==2.9.0.post0",
    # ML / stats / symbolic / graphs.
    "scikit-learn==1.9.1",
    "statsmodels==0.15.0",
    "sympy==1.14.0",
    "networkx==3.6.1",
    # Spreadsheets & documents (programmatic authoring/extraction in-code).
    "openpyxl==3.1.5",
    "XlsxWriter==3.2.9",
    "xlrd==2.0.2",
    "python-docx==1.2.0",
    "pdfplumber==0.11.10",
    "fpdf2==2.9.0",
    # Parsing / validation / formatting / misc utilities.
    "lxml==6.1.3",
    "beautifulsoup4==4.15.0",
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
    "pydantic==2.14.3",
    "regex==2026.11.19",
    "tabulate==0.10.0",
    "Faker==40.41.0",
    "wordcloud==1.9.6",
]

[project.scripts]
execute_python_code = "python_executor:cli"

[tool.hatch.build.targets.wheel]
include = ["python_executor.py"]

[tool.uv]
# uv before 0.9.17 ignores a relative exclude-newer and would lock without the window.
required-version = ">=0.9.17"
# A release has to be a week old before uv will resolve to it, so a
# compromised version is usually pulled before it reaches this lockfile.
exclude-newer = "7 days"
